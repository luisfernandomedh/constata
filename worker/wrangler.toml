name = "constata-aportes"
main = "index.js"
compatibility_date = "2026-09-01"

# Sin URL de vista previa: un solo punto de entrada público, más fácil de vigilar.
preview_urls = false

[vars]
# Repositorio donde aterrizan los issues. Separado del código a propósito:
# si el corpus recibe una queja o una marca de seguridad, la biblioteca sigue viva.
REPO_CORPUS = "luisfernandomedh/constata-corpus"

# Contador del límite por origen (5 aportes por hora).
[[kv_namespaces]]
binding = "LIMITES"
id = "cfe0c3561c724f0d852286b869e2ff8d"

# Secretos — NO van en este archivo. Se cargan con:
#   npx wrangler secret put GITHUB_TOKEN
#   npx wrangler secret put TURNSTILE_SECRET   (opcional)
